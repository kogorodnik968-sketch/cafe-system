spring:
  application:
    name: cafe-system

  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hibernate.use_sql_comments: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
    level:
      root: INFO
      com:
        cafe:
          cafeapp: DEBUG

upload:
  path: uploads

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always